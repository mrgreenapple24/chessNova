name: Cross-Platform Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            generator: Ninja
          - os: macos-latest
            cc: clang
            generator: Ninja
          - os: windows-latest
            cc: cl
            generator: Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Windows: put MSVC (cl.exe) on PATH ---
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --- Linux: install Ninja (macOS & Windows runners already have it) ---
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # --- ccache: speeds up rebuilds across runs ---
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cc }}

      # --- Configure ---
      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

      # --- Build ---
      - name: Build
        run: cmake --build build --parallel

      # --- Test ---
      - name: Test
        run: ctest --test-dir build --output-on-failure