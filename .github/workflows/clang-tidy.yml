name: clang-tidy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  clang-tidy:
    name: Static Analysis (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-tidy + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy ninja-build

      # Generate compile_commands.json so clang-tidy knows the flags
      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER=clang

      # Only analyze YOUR code — skip extern/ submodules and generated files
      - name: Run clang-tidy
        run: |
          find src include tests -name '*.c' -o -name '*.h' > files.txt
          clang-tidy -p build $(cat files.txt)
        # Remove `|| true` once your codebase is clean
        # continue-on-error: true